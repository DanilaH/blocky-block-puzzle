name: Preview checks and APK
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  VITE_SOURCE_COMMIT: ${{ github.sha }}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run assets:check
      - run: npm test
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-headless-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Use primary Ubuntu package mirror
        run: |
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
      - name: Install headless browser and dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps --only-shell chromium
      - name: Verify native CDP client against Chromium
        run: node scripts/verify-cdp-native.mjs
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            test-results/
            artifacts/native-cdp/
            docs/qa/feel-0.8/*.png
            docs/qa/feel-0.9/*.png
            docs/qa/feel-0.10/*.png
            docs/qa/feel-0.11/*.png
            docs/qa/feel-0.12/*.png
            docs/qa/usability-0.13/*.png
            docs/qa/feel-0.14/*.png
            docs/qa/feel-0.15/*.png
            docs/qa/dealer-0.16/*.png
            docs/qa/ads-0.17/*.png
  android:
    env:
      APPMETRICA_TEST_API_KEY: ${{ secrets.APPMETRICA_TEST_API_KEY }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:sync
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: blocky-preview-debug-keystore-v1
      - name: Ensure cached preview signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Blocky Preview,O=Development,C=RU"
          fi
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/blocky-distributions
          key: blocky-gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Prepare checksum-pinned Gradle
        id: gradle
        run: python3 scripts/prepare_gradle.py
      - name: Test and assemble Android
        run: '"${{ steps.gradle.outputs.gradle-bin }}" --project-dir android testDebugUnitTest assembleDebug assembleDebugAndroidTest --no-daemon'
      - uses: actions/upload-artifact@v4
        with:
          name: blocky-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14


      - uses: actions/upload-artifact@v4
        with:
          name: blocky-cdp-android-smoke
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 3
  cdp-emulator:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: blocky-preview-debug-apk
          path: diagnostic-app
      - uses: actions/download-artifact@v4
        with:
          name: blocky-cdp-android-smoke
          path: diagnostic-test
      - name: Enable KVM for the ephemeral emulator
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r diagnostic-app/app-debug.apk
            adb install -r -t diagnostic-test/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.danilah.blocky.dev.CdpDeviceSmoke com.danilah.blocky.dev.test/androidx.test.runner.AndroidJUnitRunner | tee cdp-emulator-result.txt
            ! grep -q 'FAILURES!!!\|INSTRUMENTATION_FAILED\|Process crashed' cdp-emulator-result.txt
            grep -q 'OK (1 test)' cdp-emulator-result.txt
            adb exec-out run-as com.danilah.blocky.dev cat cache/blocky-full-diagnostic.zip > cdp-emulator-full.zip
            python3 scripts/analyze-full-clear.py cdp-emulator-full.zip cdp-emulator-analysis.json
      - name: Retain emulator failure logs
        if: always()
        run: adb logcat -d -t 1500 > cdp-emulator-logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdp-emulator-proof
          path: |
            cdp-emulator-result.txt
            cdp-emulator-logcat.txt
            cdp-emulator-full.zip
            cdp-emulator-analysis.json
