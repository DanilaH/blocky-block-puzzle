apply plugin: 'com.android.application'

def metricaKey = System.getenv('APPMETRICA_API_KEY') ?: ''
def validMetricaKey = metricaKey ==~ /[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/
def testMetricaKey = System.getenv('APPMETRICA_TEST_API_KEY') ?: ''
def validTestMetricaKey = testMetricaKey ==~ /[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}/
// Owner playtests need demo ads, but do not require an analytics account.
// Sending analytics is an explicit opt-in to a separate test project.
def previewAnalytics = System.getenv('BLOCKY_PREVIEW_ANALYTICS') ?: 'off'

def liveAdIds = [
    banner: System.getenv('YANDEX_BANNER_AD_UNIT_ID') ?: '',
    interstitial: System.getenv('YANDEX_INTERSTITIAL_AD_UNIT_ID') ?: '',
    rewarded: System.getenv('YANDEX_REWARDED_AD_UNIT_ID') ?: ''
]
def validAdIds = liveAdIds.values().every { it ==~ /R-M-[0-9]+-[0-9]+/ }
gradle.taskGraph.whenReady { graph ->
    def previewPackaging = graph.allTasks.any { it.name == 'packageDebug' || it.name == 'assembleDebug' }
    if (previewPackaging && !(previewAnalytics in ['off', 'test'])) {
        throw new GradleException('BLOCKY_PREVIEW_ANALYTICS must be off or test')
    }
    if (previewPackaging && previewAnalytics == 'test' && (!validTestMetricaKey || (validMetricaKey && testMetricaKey == metricaKey))) {
        throw new GradleException('Test APK requires a separate valid APPMETRICA_TEST_API_KEY; never use the production key')
    }
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !validMetricaKey) {
        throw new GradleException('Release requires APPMETRICA_API_KEY')
    }
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !validAdIds) {
        throw new GradleException('Release requires three valid YANDEX_*_AD_UNIT_ID values; demo IDs are debug-only')
    }
}

android {
    buildFeatures { buildConfig true }
    namespace = "com.danilah.blocky.dev"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.danilah.blocky.dev"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 64
        versionName "0.64.0-preview"
        resValue "string", "appmetrica_api_key", previewAnalytics == 'test' && validTestMetricaKey ? testMetricaKey : ""
        resValue "bool", "ads_test_mode", "true"
        resValue "string", "yandex_banner_id", ""
        resValue "string", "yandex_interstitial_id", ""
        resValue "string", "yandex_rewarded_id", ""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            resValue "string", "appmetrica_api_key", validMetricaKey ? metricaKey : ""
            resValue "bool", "ads_test_mode", "false"
            liveAdIds.each { format, id -> resValue "string", "yandex_${format}_id", (id ==~ /R-M-[0-9]+-[0-9]+/) ? id : "" }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.yandex.android:mobileads:8.6.0'
    implementation 'io.appmetrica.analytics:analytics:8.6.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
